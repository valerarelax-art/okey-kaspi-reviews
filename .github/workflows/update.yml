name: Update Kaspi review count
on:
  schedule:
    - cron: "17 3 * * *"   # daily, 08:17 Almaty
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch count from Kaspi.kz
        env:
          OKEY_KASPI_REVIEWS_OUT: ${{ github.workspace }}/kaspi-reviews.json
        run: python3 scripts/update_kaspi_reviews.py
      - name: Commit if changed
        run: |
          git config user.name "okey-bot"
          git config user.email "okey-bot@users.noreply.github.com"
          git add kaspi-reviews.json
          git diff --cached --quiet || git commit -m "Kaspi reviews: $(python3 -c 'import json;d=json.load(open("kaspi-reviews.json"));print(d["total"], d["rating"])')"
          git push
